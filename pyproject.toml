[project]
name = "pointcloudsimilarity"
version = "1.0.0"
description = "Topological Alignment Spectrum (TAS) and other similarity measures between paired point clouds"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Tiago Tavares", email = "tiagoft@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "pot>=0.9.6.post1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "torch>=2.9.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "pytest>=9.0.1",
    "pytest-benchmark>=5.2.3",
]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
addopts = "--benchmark-columns=mean,min,max,stddev"
